<!DOCTYPE html>
<html>
<head>

    <script type="text/javascript" src="/visualizations/vis-network.min.js"></script>

    <style>
        :root {
            --bg-main: #F8FAFC;
            --bg-card: #FFFFFF;
            --border: #E2E8F0;
            --primary: #0D9488;
            --navy: #0F172A;
            --text-dark: #1E293B;
            --text-muted: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            padding: 12px 16px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        h1 { font-size: 15px; font-weight: 700; color: var(--navy); }
        .badge {
            background: #F0FDFA;
            color: var(--primary);
            border: 1px solid #CCFBF1;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }
        .legend { display: flex; gap: 14px; margin-bottom: 8px; font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
        .item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        #network {
            flex: 1;
            background: #FFFFFF;
            border-radius: 8px;
            border: 1px solid var(--border);
            min-height: 250px;
        }
    </style>
